<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Student - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #06b6d4;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .navbar {
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color)) !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }
        
        .navbar-brand {
            font-weight: 700;
            color: white !important;
        }
        
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }
        
        .form-title {
            color: var(--primary-color);
            margin-bottom: 30px;
            font-weight: 700;
            font-size: 1.8rem;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
            display: block;
        }
        
        .form-control, .form-select {
            border-radius: 8px;
            border: 1.5px solid #e5e7eb;
            padding: 12px 15px;
            transition: all 0.3s;
            font-size: 0.95rem;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            outline: none;
        }
        
        .form-control::placeholder {
            color: #9ca3af;
        }
        
        .required::after {
            content: " *";
            color: #ef4444;
        }
        
        .btn-submit {
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px 40px;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
            color: white;
        }
        
        .btn-cancel {
            background: #e5e7eb;
            color: #374151;
            font-weight: 600;
            padding: 12px 40px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn-cancel:hover {
            background: #d1d5db;
            color: #1f2937;
        }
        
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }
        
        .form-text {
            font-size: 0.875rem;
            color: #6b7280;
            margin-top: 5px;
        }
        
        .error-message {
            color: #dc2626;
            font-size: 0.875rem;
            margin-top: 5px;
        }
        
        .error-list {
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            color: #991b1b;
        }
        
        .error-list ul {
            margin: 10px 0 0 20px;
            padding: 0;
        }
        
        .error-list li {
            margin: 5px 0;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .form-container {
                padding: 25px;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .button-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-graduation-cap"></i> Student Management System
            </a>
        </div>
    </nav>

    <div class="form-container">
        <h1 class="form-title">
            <i class="fas fa-edit"></i> Update Student Information
        </h1>

        <form th:action="@{/edit/{id}(id=${student.id})}" method="post" th:object="${student}" novalidate>
            <!-- Error Messages -->
            <div th:if="${#fields.hasErrors('*')}" class="error-list">
                <strong>Please fix the following errors:</strong>
                <ul>
                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                </ul>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label required">Full Name</label>
                    <input type="text" class="form-control" th:field="*{name}" 
                           placeholder="Enter student name"
                           th:classappend="${#fields.hasErrors('name') ? 'is-invalid' : ''}">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}"
                         th:errors="*{name}"></div>
                </div>
                
                <div class="form-group">
                    <label class="form-label required">Roll Number</label>
                    <input type="text" class="form-control" th:field="*{rollNumber}" 
                           placeholder="e.g., STU001"
                           th:classappend="${#fields.hasErrors('rollNumber') ? 'is-invalid' : ''}">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label required">Email Address</label>
                    <input type="email" class="form-control" th:field="*{email}" 
                           placeholder="student@example.com"
                           th:classappend="${#fields.hasErrors('email') ? 'is-invalid' : ''}">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}"></div>
                </div>
                
                <div class="form-group">
                    <label class="form-label required">Phone Number</label>
                    <input type="tel" class="form-control" th:field="*{phone}" 
                           placeholder="+91 XXXXXXXXXX"
                           th:classappend="${#fields.hasErrors('phone') ? 'is-invalid' : ''}">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}"
                         th:errors="*{phone}"></div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label required">Department</label>
                    <input type="text" class="form-control" th:field="*{department}" 
                           placeholder="e.g., Computer Science"
                           th:classappend="${#fields.hasErrors('department') ? 'is-invalid' : ''}">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('department')}"
                         th:errors="*{department}"></div>
                </div>
                
                <div class="form-group">
                    <label class="form-label required">GPA</label>
                    <input type="text" class="form-control" th:field="*{gpa}" 
                           placeholder="e.g., 3.8" step="0.1" min="0" max="4">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label required">Marks (0-100)</label>
                <input type="number" class="form-control" th:field="*{marks}" 
                       placeholder="0" min="0" max="100"
                       th:classappend="${#fields.hasErrors('marks') ? 'is-invalid' : ''}">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('marks')}"
                     th:errors="*{marks}"></div>
                <small class="form-text">Enter marks between 0 and 100</small>
            </div>

            <div class="form-group">
                <label class="form-label">Status</label>
                <select class="form-select" th:field="*{status}">
                    <option value="ACTIVE">Active</option>
                    <option value="INACTIVE">Inactive</option>
                    <option value="GRADUATED">Graduated</option>
                </select>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-submit">
                    <i class="fas fa-save"></i> Update Student
                </button>
                <a href="/" class="btn-cancel">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
