<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #06b6d4;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .signup-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            max-width: 500px;
            margin: 0 auto;
            padding: 50px;
        }
        
        .form-title {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-weight: 700;
            font-size: 2rem;
            text-align: center;
        }
        
        .form-subtitle {
            color: #6b7280;
            margin-bottom: 30px;
            text-align: center;
            font-size: 0.95rem;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
            display: block;
            font-size: 0.9rem;
        }
        
        .form-control {
            border-radius: 8px;
            border: 1.5px solid #e5e7eb;
            padding: 12px 15px;
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            outline: none;
        }
        
        .btn-signup {
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-top: 10px;
            font-size: 1rem;
        }
        
        .btn-signup:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
            color: white;
        }
        
        .login-link {
            margin-top: 25px;
            text-align: center;
            color: #6b7280;
            border-top: 1px solid #e5e7eb;
            padding-top: 20px;
        }
        
        .login-link a {
            color: var(--primary-color);
            font-weight: 600;
            text-decoration: none;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
        
        .alert {
            border-radius: 8px;
            border: none;
            margin-bottom: 25px;
        }
        
        .alert-danger {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .password-strength {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #6b7280;
        }
        
        .strength-bar {
            height: 5px;
            background: #e5e7eb;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }
        
        .strength-fill {
            height: 100%;
            transition: all 0.3s;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <h1 class="form-title">
            <i class="fas fa-user-plus"></i> Sign Up
        </h1>
        <p class="form-subtitle">Create your account to get started</p>

        <!-- Error Messages -->
        <div th:if="${errorMessage}" class="alert alert-danger">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <form method="post" action="/signup" novalidate>
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" name="username" placeholder="Choose a username" required minlength="3">
                <small class="form-text text-muted">At least 3 characters</small>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" name="email" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" id="password" placeholder="Enter a strong password" required minlength="6">
                <div class="password-strength">
                    <small>At least 6 characters</small>
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill" style="width: 0%;"></div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-control" name="confirmPassword" id="confirmPassword" placeholder="Confirm your password" required minlength="6">
            </div>

            <div class="form-group">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
                    <label class="form-check-label" for="terms">
                        I agree to the <a href="#" style="color: var(--primary-color); text-decoration: none;">Terms and Conditions</a>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-signup">
                <i class="fas fa-user-check"></i> Create Account
            </button>

            <div class="login-link">
                Already have an account? 
                <a href="/login">Login here</a>
            </div>
        </form>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const strengthFill = document.getElementById('strengthFill');
        
        if (passwordInput) {
            passwordInput.addEventListener('input', function() {
                const strength = this.value.length;
                const percent = Math.min((strength / 10) * 100, 100);
                strengthFill.style.width = percent + '%';
                
                if (strength < 6) {
                    strengthFill.style.backgroundColor = '#ef4444';
                } else if (strength < 10) {
                    strengthFill.style.backgroundColor = '#f97316';
                } else if (strength < 15) {
                    strengthFill.style.backgroundColor = '#eab308';
                } else {
                    strengthFill.style.backgroundColor = '#10b981';
                }
            });
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
